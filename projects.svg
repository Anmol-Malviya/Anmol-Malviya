      <text x="20" y="27" font-size="9" letter-spacing="2" fill="#64748B">MISSION 01 · AI</text>
      <circle cx="319" cy="23" r="4" fill="#10B981"/><text x="307" y="27" text-anchor="end" font-size="9" fill="#10B981">ACTIVE</text>
      <text x="20" y="59" font-size="17" font-weight="700" fill="#F8FAFC">AI Interviewer</text>
      <text x="20" y="82" font-size="11" fill="#94A3B8">Adaptive mock interviews with feedback,</text>
      <text x="20" y="99" font-size="11" fill="#64748B">analytics and daily practice challenges.</text>
      <rect x="20" y="119" width="58" height="23" rx="11.5" fill="#111C30"/><text x="49" y="134" text-anchor="middle" font-size="9" fill="#22D3EE">React</text>
      <rect x="85" y="119" width="64" height="23" rx="11.5" fill="#111C30"/><text x="117" y="134" text-anchor="middle" font-size="9" fill="#10B981">Node.js</text>
      <rect x="156" y="119" width="70" height="23" rx="11.5" fill="#111C30"/><text x="191" y="134" text-anchor="middle" font-size="9" fill="#A78BFA">MongoDB</text>
      <text x="330" y="149" text-anchor="end" font-size="9.5" fill="#475569">/AI-Interviewer →</text>
