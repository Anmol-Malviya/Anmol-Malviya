      <rect x="20" y="119" width="64" height="23" rx="11.5" fill="#111C30"/><text x="52" y="134" text-anchor="middle" font-size="9" fill="#22D3EE">Web App</text>
      <rect x="91" y="119" width="60" height="23" rx="11.5" fill="#111C30"/><text x="121" y="134" text-anchor="middle" font-size="9" fill="#10B981">College</text>
      <text x="330" y="149" text-anchor="end" font-size="9.5" fill="#475569">/GPC-Itarsi →</text>
    </g>

    <g transform="translate(38 370)">
      <rect width="350" height="166" rx="13" fill="#0D1728" stroke="#22D3EE" stroke-opacity=".24"/>
      <text x="20" y="27" font-size="9" letter-spacing="2" fill="#64748B">MISSION 04 · FULL STACK</text>
      <text x="20" y="59" font-size="17" font-weight="700" fill="#F8FAFC">ProjectX</text>
      <text x="20" y="82" font-size="11" fill="#94A3B8">Practical full-stack product experiments</text>
      <text x="20" y="99" font-size="11" fill="#64748B">focused on engineering and iteration.</text>
      <text x="20" y="143" font-size="10" fill="#22D3EE">OPEN REPOSITORY</text><text x="330" y="143" text-anchor="end" font-size="9.5" fill="#475569">/ProjectX →</text>
    </g>

    <g transform="translate(415 370)">
      <rect width="350" height="166" rx="13" fill="#0D1728" stroke="#A78BFA" stroke-opacity=".24"/>
      <text x="20" y="27" font-size="9" letter-spacing="2" fill="#64748B">MISSION 05 · DESIGN</text>
      <text x="20" y="59" font-size="17" font-weight="700" fill="#F8FAFC">UIUX</text>
      <text x="20" y="82" font-size="11" fill="#94A3B8">Interface exploration, interaction ideas</text>
      <text x="20" y="99" font-size="11" fill="#64748B">and visual design experiments.</text>
      <text x="20" y="143" font-size="10" fill="#A78BFA">OPEN REPOSITORY</text><text x="330" y="143" text-anchor="end" font-size="9.5" fill="#475569">/UIUX →</text>
    </g>

    <g transform="translate(792 370)">
