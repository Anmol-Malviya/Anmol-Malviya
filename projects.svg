      <text x="20" y="27" font-size="9" letter-spacing="2" fill="#64748B">MISSION 06 · AI EXPERIMENT</text>
      <text x="20" y="59" font-size="17" font-weight="700" fill="#F8FAFC">AI Danger Kinetic</text>
      <text x="20" y="82" font-size="11" fill="#94A3B8">AI-focused experimental build from the</text>
      <text x="20" y="99" font-size="11" fill="#64748B">applied-project collection.</text>
      <text x="20" y="143" font-size="10" fill="#10B981">OPEN REPOSITORY</text><text x="330" y="143" text-anchor="end" font-size="9.5" fill="#475569">/AI-Danger-Kinetic →</text>
