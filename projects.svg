    <line x1="38" y1="558" x2="1142" y2="558" stroke="#233149"/>
    <text x="38" y="584" font-size="9" letter-spacing="2" fill="#475569">NEXT OBJECTIVE</text>
    <text x="143" y="584" font-size="10.5" fill="#94A3B8">keep shipping useful, ambitious products</text>
    <text x="1142" y="584" text-anchor="end" font-size="10" fill="#22D3EE">github.com/Anmol-Malviya</text>
