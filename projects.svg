      <text x="20" y="99" font-size="11" fill="#64748B">motion and immersive dark-mode styling.</text>
      <rect x="20" y="119" width="54" height="23" rx="11.5" fill="#111C30"/><text x="47" y="134" text-anchor="middle" font-size="9" fill="#22D3EE">HTML</text>
