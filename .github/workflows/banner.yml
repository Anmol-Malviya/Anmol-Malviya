name: Generate Profile Banner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ANMOL.png"
      - "tools/generate_banner.py"
      - ".github/workflows/banner.yml"

permissions:
  contents: write

jobs:
  generate-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image pipeline dependencies
        run: pip install pillow numpy scipy

      - name: Generate dark and light profile banners
        run: python tools/generate_banner.py

      - name: Commit generated banner assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg assets/portrait_dark.npy assets/portrait_light.npy
          if git diff --cached --quiet; then
            echo "No banner changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate animated profile banner"
          git pull --rebase origin main
          git push origin main
