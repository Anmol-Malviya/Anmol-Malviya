<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020916"/>
      <stop offset="100%" style="stop-color:#0b1629"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="30%" style="stop-color:#00d9ff"/>
      <stop offset="70%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)" rx="16"/>
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="0.7" fill="#ffd60a" opacity="0.05"/>
  </pattern>
  <rect width="900" height="220" fill="url(#dots)" rx="16"/>
  <rect width="898" height="218" x="1" y="1" rx="15" fill="none" stroke="rgba(255,214,10,0.2)" stroke-width="1"/>
  <rect x="150" y="0" width="600" height="2" rx="1" fill="url(#hdr)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" fill="#ffd60a" letter-spacing="5" font-weight="900" filter="url(#softglow)">GITHUB ACHIEVEMENTS</text>
  <rect x="150" y="48" width="600" height="1" rx="0.5" fill="url(#hdr)" opacity="0.4"/>

  <!-- Trophy cards — 6 across -->
  <!-- Helper: each card 128px wide, 8px gap, starts at 30 -->

  <!-- 1: Multi-Language — S Rank -->
  <g transform="translate(30, 65)">
    <rect width="128" height="120" rx="12" fill="rgba(255,214,10,0.05)" stroke="rgba(255,214,10,0.3)" stroke-width="1.2"/>
    <!-- top accent -->
    <rect x="0" y="0" width="128" height="3" rx="2" fill="#ffd60a" opacity="0.8"/>
    <!-- trophy icon -->
    <text x="64" y="52" text-anchor="middle" font-size="34">🏆</text>
    <text x="64" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#aaa" letter-spacing="1">MULTI-LANG</text>
    <!-- rank badge -->
    <rect x="34" y="88" width="60" height="22" rx="11" fill="rgba(255,214,10,0.15)" stroke="#ffd60a" stroke-width="1"/>
    <text x="64" y="103" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="11" fill="#ffd60a" font-weight="900" filter="url(#softglow)">S-RANK</text>
    <!-- animated border glow -->
    <rect width="128" height="120" rx="12" fill="none" stroke="#ffd60a" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 2: Stargazer — A Rank -->
  <g transform="translate(168, 65)">
    <rect width="128" height="120" rx="12" fill="rgba(255,107,157,0.05)" stroke="rgba(255,107,157,0.3)" stroke-width="1.2"/>
    <rect x="0" y="0" width="128" height="3" rx="2" fill="#ff6b9d" opacity="0.8"/>
    <text x="64" y="52" text-anchor="middle" font-size="34">⭐</text>
    <text x="64" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#aaa" letter-spacing="1">STARGAZER</text>
    <rect x="34" y="88" width="60" height="22" rx="11" fill="rgba(255,107,157,0.15)" stroke="#ff6b9d" stroke-width="1"/>
    <text x="64" y="103" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="11" fill="#ff6b9d" font-weight="900" filter="url(#softglow)">A-RANK</text>
    <rect width="128" height="120" rx="12" fill="none" stroke="#ff6b9d" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 3: Commits — S Rank -->
  <g transform="translate(306, 65)">
    <rect width="128" height="120" rx="12" fill="rgba(0,217,255,0.05)" stroke="rgba(0,217,255,0.3)" stroke-width="1.2"/>
    <rect x="0" y="0" width="128" height="3" rx="2" fill="#00d9ff" opacity="0.8"/>
    <text x="64" y="52" text-anchor="middle" font-size="34">💻</text>
    <text x="64" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#aaa" letter-spacing="1">COMMITS</text>
    <rect x="34" y="88" width="60" height="22" rx="11" fill="rgba(0,217,255,0.15)" stroke="#00d9ff" stroke-width="1"/>
    <text x="64" y="103" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="11" fill="#00d9ff" font-weight="900" filter="url(#softglow)">S-RANK</text>
    <rect width="128" height="120" rx="12" fill="none" stroke="#00d9ff" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 4: Repositories — A Rank -->
  <g transform="translate(444, 65)">
    <rect width="128" height="120" rx="12" fill="rgba(157,78,221,0.05)" stroke="rgba(157,78,221,0.3)" stroke-width="1.2"/>
    <rect x="0" y="0" width="128" height="3" rx="2" fill="#9d4edd" opacity="0.8"/>
    <text x="64" y="52" text-anchor="middle" font-size="34">📦</text>
    <text x="64" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#aaa" letter-spacing="1">REPOSITORIES</text>
    <rect x="34" y="88" width="60" height="22" rx="11" fill="rgba(157,78,221,0.15)" stroke="#9d4edd" stroke-width="1"/>
    <text x="64" y="103" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="11" fill="#9d4edd" font-weight="900" filter="url(#softglow)">A-RANK</text>
    <rect width="128" height="120" rx="12" fill="none" stroke="#9d4edd" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 5: Followers — B Rank -->
  <g transform="translate(582, 65)">
    <rect width="128" height="120" rx="12" fill="rgba(0,255,136,0.05)" stroke="rgba(0,255,136,0.3)" stroke-width="1.2"/>
    <rect x="0" y="0" width="128" height="3" rx="2" fill="#00ff88" opacity="0.8"/>
    <text x="64" y="52" text-anchor="middle" font-size="34">👥</text>
    <text x="64" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#aaa" letter-spacing="1">FOLLOWERS</text>
    <rect x="34" y="88" width="60" height="22" rx="11" fill="rgba(0,255,136,0.15)" stroke="#00ff88" stroke-width="1"/>
    <text x="64" y="103" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="11" fill="#00ff88" font-weight="900" filter="url(#softglow)">B-RANK</text>
    <rect width="128" height="120" rx="12" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 6: Pull Requests — A Rank -->
  <g transform="translate(720, 65)">
    <rect width="128" height="120" rx="12" fill="rgba(0,217,255,0.05)" stroke="rgba(0,217,255,0.3)" stroke-width="1.2"/>
    <rect x="0" y="0" width="128" height="3" rx="2" fill="#00d9ff" opacity="0.8"/>
    <text x="64" y="52" text-anchor="middle" font-size="34">🔀</text>
    <text x="64" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#aaa" letter-spacing="1">PULL REQUESTS</text>
    <rect x="34" y="88" width="60" height="22" rx="11" fill="rgba(0,217,255,0.15)" stroke="#00d9ff" stroke-width="1"/>
    <text x="64" y="103" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="11" fill="#00d9ff" font-weight="900" filter="url(#softglow)">A-RANK</text>
    <rect width="128" height="120" rx="12" fill="none" stroke="#00d9ff" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom accent -->
  <rect x="150" y="218" width="600" height="2" rx="1" fill="url(#hdr)" opacity="0.5"/>
</svg>
