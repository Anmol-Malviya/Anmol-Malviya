<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="85%" stop-color="#14213D" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="glowCyan" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for neon glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, Monaco, monospace; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Ambient Perspective Grid -->
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Atmospheric Glow Orbs -->
  <rect width="1200" height="400" fill="url(#glowCyan)" rx="16" />
  <rect width="1200" height="400" fill="url(#glowViolet)" rx="16" />
  <rect width="1200" height="400" fill="url(#glowEmerald)" rx="16" />

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Floating Tech Geometric Decor (Right Side 3D Aesthetic) -->
  <g transform="translate(870, 70)" opacity="0.85">
    <!-- Isometric Cube / Wireframe Box -->
    <polygon points="120,40 210,90 120,140 30,90" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.7" />
    <polygon points="30,90 120,140 120,240 30,190" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-opacity="0.7" />
    <polygon points="210,90 120,140 120,240 210,190" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-opacity="0.8" />
    <!-- Floating Node Coordinates -->
    <circle cx="120" cy="40" r="4" fill="#00F0FF" filter="url(#neonGlow)" />
    <circle cx="210" cy="90" r="4" fill="#38BDF8" />
    <circle cx="30" cy="90" r="4" fill="#818CF8" />
    <circle cx="120" cy="140" r="5" fill="#FFFFFF" filter="url(#neonGlow)" />
    <circle cx="120" cy="240" r="4" fill="#C084FC" />
    <!-- Internal Glowing Core -->
    <circle cx="120" cy="140" r="28" fill="#00F0FF" fill-opacity="0.12" filter="url(#neonGlow)" />
    
    <!-- Code Accent floating card -->
    <g transform="translate(60, 180)">
      <rect width="150" height="54" rx="8" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="3.5" fill="#EF4444" />
      <circle cx="28" cy="16" r="3.5" fill="#F59E0B" />
      <circle cx="40" cy="16" r="3.5" fill="#10B981" />
      <text x="14" y="38" fill="#38BDF8" font-size="11" class="font-mono">threejs.render()</text>
    </g>
  </g>

  <!-- Content Group (Left to Center) -->
  <g transform="translate(80, 75)">
    <!-- Status / Role Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="365" height="34" rx="17" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <!-- Pulsing Dot -->
      <circle cx="20" cy="17" r="5" fill="#10B981" />
      <circle cx="20" cy="17" r="9" fill="#10B981" fill-opacity="0.3" />
      <text x="36" y="22" fill="#E2E8F0" font-size="12" font-weight="600" class="font-mono" letter-spacing="0.5">
        BUILDER • FOUNDER • TECH LEAD
      </text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="96" fill="url(#titleGrad)" font-size="54" font-weight="800" class="font-sans" letter-spacing="-1">
      ANMOL MALVIYA
    </text>

    <!-- Tagline & Core Positioning -->
    <text x="0" y="142" fill="url(#tagGrad)" font-size="17" font-weight="700" class="font-mono" letter-spacing="2">
      BUILDING PRODUCTS THAT MOVE IDEAS FORWARD
    </text>

    <!-- Narrative / Bio Lines -->
    <text x="0" y="180" fill="#94A3B8" font-size="14.5" font-weight="400" class="font-sans">
      Full-Stack Software Architecture • Autonomous AI Workflows • Immersive 3D Systems
    </text>

    <text x="0" y="206" fill="#64748B" font-size="13.5" font-weight="500" class="font-mono">
      Project Manager @ AV Technologies (AdhritVerse) &nbsp;•&nbsp; Winner @ TECHSPRINT 2025
    </text>

    <!-- Interactive / High-impact Metric Highlights -->
    <g transform="translate(0, 235)">
      <!-- Metric 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="36" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
        <text x="14" y="23" fill="#38BDF8" font-size="12" font-weight="600" class="font-mono">⚡ 8+ BUILDS</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(148, 0)">
        <rect width="180" height="36" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
        <text x="14" y="23" fill="#818CF8" font-size="12" font-weight="600" class="font-mono">🤖 AGENTIC & AI</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(341, 0)">
        <rect width="185" height="36" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
        <text x="14" y="23" fill="#00F0FF" font-size="12" font-weight="600" class="font-mono">🌐 GLOBAL SCOPE</text>
      </g>
    </g>
  </g>
</svg>

