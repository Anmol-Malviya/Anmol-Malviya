    <text x="356" y="16" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#00d9ff" font-weight="bold">80%</text>
    <rect x="14" y="24" width="342" height="8" rx="4" fill="rgba(255,255,255,0.04)"/>
    <rect x="14" y="24" width="0" height="8" rx="4" fill="url(#barCyan)" filter="url(#softglow)">
