<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020916"/>
      <stop offset="100%" style="stop-color:#0b1629"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff"/>
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="barPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:#cc3366;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00bb55;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9d4edd"/>
      <stop offset="100%" style="stop-color:#7b2fbf;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="barYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd60a"/>
      <stop offset="100%" style="stop-color:#cc9900;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="30%" style="stop-color:#00d9ff"/>
      <stop offset="70%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="340" fill="url(#bg)" rx="16"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.7" fill="#00d9ff" opacity="0.06"/>
  </pattern>
  <rect width="900" height="340" fill="url(#dots)" rx="16"/>

  <!-- Border -->
  <rect width="898" height="338" x="1" y="1" rx="15" fill="none" stroke="rgba(0,217,255,0.25)" stroke-width="1"/>

  <!-- Top accent -->
  <rect x="150" y="0" width="600" height="2" rx="1" fill="url(#hdr)"/>

  <!-- Header -->
  <text x="450" y="42" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" fill="#00d9ff" letter-spacing="5" font-weight="900" filter="url(#softglow)">SKILL PROFICIENCY</text>
  <rect x="150" y="52" width="600" height="1" rx="0.5" fill="url(#hdr)" opacity="0.5"/>

  <!-- ══════ LEFT COLUMN ══════ -->

  <!-- Skill 1: JavaScript 92% -->
  <g transform="translate(50, 78)">
    <rect x="0" y="0" width="370" height="40" rx="8" fill="rgba(255,214,10,0.04)" stroke="rgba(255,214,10,0.15)" stroke-width="1"/>
    <text x="14" y="16" font-family="'Courier New', monospace" font-size="12" fill="#ffd60a" font-weight="bold">🟡 JavaScript</text>
    <text x="356" y="16" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#ffd60a" font-weight="bold">92%</text>
    <rect x="14" y="24" width="342" height="8" rx="4" fill="rgba(255,255,255,0.04)"/>
    <rect x="14" y="24" width="0" height="8" rx="4" fill="url(#barYellow)" filter="url(#softglow)">
      <animate attributeName="width" values="0;0;315;315" keyTimes="0;0.05;0.25;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Skill 2: React 90% -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="370" height="40" rx="8" fill="rgba(0,217,255,0.04)" stroke="rgba(0,217,255,0.15)" stroke-width="1"/>
    <text x="14" y="16" font-family="'Courier New', monospace" font-size="12" fill="#00d9ff" font-weight="bold">⚛️ React</text>
    <text x="356" y="16" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#00d9ff" font-weight="bold">90%</text>
    <rect x="14" y="24" width="342" height="8" rx="4" fill="rgba(255,255,255,0.04)"/>
    <rect x="14" y="24" width="0" height="8" rx="4" fill="url(#barCyan)" filter="url(#softglow)">
      <animate attributeName="width" values="0;0;308;308" keyTimes="0;0.08;0.28;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Skill 3: Node.js 85% -->
  <g transform="translate(50, 182)">
    <rect x="0" y="0" width="370" height="40" rx="8" fill="rgba(0,255,136,0.04)" stroke="rgba(0,255,136,0.15)" stroke-width="1"/>
    <text x="14" y="16" font-family="'Courier New', monospace" font-size="12" fill="#00ff88" font-weight="bold">🟩 Node.js</text>
    <text x="356" y="16" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#00ff88" font-weight="bold">85%</text>
    <rect x="14" y="24" width="342" height="8" rx="4" fill="rgba(255,255,255,0.04)"/>
    <rect x="14" y="24" width="0" height="8" rx="4" fill="url(#barGreen)" filter="url(#softglow)">
