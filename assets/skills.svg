  <g transform="translate(480, 234)">
    <rect x="0" y="0" width="370" height="40" rx="8" fill="rgba(255,107,157,0.04)" stroke="rgba(255,107,157,0.15)" stroke-width="1"/>
    <text x="14" y="16" font-family="'Courier New', monospace" font-size="12" fill="#ff6b9d" font-weight="bold">🎨 UI/UX Design</text>
    <text x="356" y="16" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#ff6b9d" font-weight="bold">75%</text>
    <rect x="14" y="24" width="342" height="8" rx="4" fill="rgba(255,255,255,0.04)"/>
    <rect x="14" y="24" width="0" height="8" rx="4" fill="url(#barPink)" filter="url(#softglow)">
      <animate attributeName="width" values="0;0;257;257" keyTimes="0;0.19;0.39;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Skill 10: Docker 65% -->
  <g transform="translate(480, 286)">
    <rect x="0" y="0" width="370" height="40" rx="8" fill="rgba(157,78,221,0.04)" stroke="rgba(157,78,221,0.15)" stroke-width="1"/>
    <text x="14" y="16" font-family="'Courier New', monospace" font-size="12" fill="#9d4edd" font-weight="bold">🐳 Docker</text>
    <text x="356" y="16" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#9d4edd" font-weight="bold">65%</text>
