    <rect x="0" y="0" width="412" height="4" rx="3" fill="url(#g2)"/>
    <text x="20" y="34" font-size="26">💬</text>
    <text x="54" y="32" font-family="'Arial Bold', sans-serif" font-size="15" fill="#ffffff" font-weight="700">Real-Time Chat App</text>
    <text x="54" y="48" font-family="'Courier New', monospace" font-size="10" fill="#8b949e">Socket.io · React · Node.js · Redis</text>
    <line x1="20" y1="58" x2="392" y2="58" stroke="rgba(255,107,157,0.1)" stroke-width="1"/>
    <text x="20" y="78" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">WebSocket-powered chat with rooms,</text>
    <text x="20" y="96" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">typing indicators &amp; file sharing.</text>
