<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020916"/>
      <stop offset="100%" style="stop-color:#0b1629"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="30%" style="stop-color:#00d9ff"/>
      <stop offset="70%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff"/>
      <stop offset="100%" style="stop-color:#9d4edd"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:#ff9f43"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00d9ff"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9d4edd"/>
      <stop offset="100%" style="stop-color:#ff6b9d"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#bg)" rx="16"/>
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.65" fill="#00d9ff" opacity="0.055"/>
  </pattern>
  <rect width="900" height="480" fill="url(#dots)" rx="16"/>
  <rect width="898" height="478" x="1" y="1" rx="15" fill="none" stroke="rgba(0,217,255,0.2)" stroke-width="1"/>
  <rect x="150" y="0" width="600" height="2" rx="1" fill="url(#hdr)"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" fill="#00d9ff" letter-spacing="5" font-weight="900" filter="url(#softglow)">FEATURED PROJECTS</text>
  <rect x="150" y="52" width="600" height="1" rx="0.5" fill="url(#hdr)" opacity="0.4"/>

  <!-- ═══ ROW 1 ═══ -->

  <!-- Project 1: E-Commerce -->
  <g transform="translate(28, 70)">
    <rect width="412" height="170" rx="14" fill="rgba(0,217,255,0.04)" stroke="rgba(0,217,255,0.2)" stroke-width="1"/>
    <rect x="0" y="0" width="412" height="4" rx="3" fill="url(#g1)"/>
    <text x="20" y="34" font-size="26">🛒</text>
    <text x="54" y="32" font-family="'Arial Bold', sans-serif" font-size="15" fill="#ffffff" font-weight="700">E-Commerce Platform</text>
    <text x="54" y="48" font-family="'Courier New', monospace" font-size="10" fill="#8b949e">Next.js · Stripe · PostgreSQL · TailwindCSS</text>
    <line x1="20" y1="58" x2="392" y2="58" stroke="rgba(0,217,255,0.1)" stroke-width="1"/>
    <text x="20" y="78" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Full-featured online store with product</text>
    <text x="20" y="96" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">management, cart &amp; Stripe payments.</text>
    <!-- Tags -->
    <rect x="20" y="110" width="64" height="18" rx="9" fill="rgba(0,217,255,0.08)" stroke="rgba(0,217,255,0.3)" stroke-width="0.8"/>
    <text x="52" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00d9ff">Next.js</text>
    <rect x="92" y="110" width="50" height="18" rx="9" fill="rgba(99,91,255,0.08)" stroke="rgba(99,91,255,0.3)" stroke-width="0.8"/>
    <text x="117" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9d4edd">Stripe</text>
    <rect x="150" y="110" width="70" height="18" rx="9" fill="rgba(51,103,145,0.1)" stroke="rgba(51,103,145,0.3)" stroke-width="0.8"/>
    <text x="185" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#336791">PostgreSQL</text>
    <!-- Buttons -->
    <rect x="20" y="138" width="90" height="24" rx="12" fill="url(#g1)"/>
    <text x="65" y="154" text-anchor="middle" font-family="'Arial Bold', sans-serif" font-size="11" fill="#000" font-weight="700">🌐 Live Demo</text>
    <rect x="120" y="138" width="76" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="158" y="154" text-anchor="middle" font-family="'Arial Bold', sans-serif" font-size="11" fill="#ccc">💻 Code</text>
  </g>

