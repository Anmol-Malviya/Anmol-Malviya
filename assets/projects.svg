    <text x="20" y="78" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Kanban project manager with teams,</text>
    <text x="20" y="96" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">analytics &amp; role-based access control.</text>
    <rect x="20" y="110" width="52" height="18" rx="9" fill="rgba(97,218,251,0.08)" stroke="rgba(97,218,251,0.3)" stroke-width="0.8"/>
    <text x="46" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#61DAFB">React</text>
    <rect x="80" y="110" width="68" height="18" rx="9" fill="rgba(71,162,72,0.08)" stroke="rgba(71,162,72,0.3)" stroke-width="0.8"/>
    <text x="114" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#47A248">MongoDB</text>
    <rect x="156" y="110" width="44" height="18" rx="9" fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.3)" stroke-width="0.8"/>
    <text x="178" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00ff88">JWT</text>
    <rect x="20" y="138" width="90" height="24" rx="12" fill="url(#g3)"/>
    <text x="65" y="154" text-anchor="middle" font-family="'Arial Bold', sans-serif" font-size="11" fill="#000" font-weight="700">🌐 Live Demo</text>
    <rect x="120" y="138" width="76" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="158" y="154" text-anchor="middle" font-family="'Arial Bold', sans-serif" font-size="11" fill="#ccc">💻 Code</text>
  </g>

  <!-- Project 4: AI Generator -->
  <g transform="translate(460, 260)">
    <rect width="412" height="170" rx="14" fill="rgba(157,78,221,0.04)" stroke="rgba(157,78,221,0.2)" stroke-width="1"/>
    <rect x="0" y="0" width="412" height="4" rx="3" fill="url(#g4)"/>
    <text x="20" y="34" font-size="26">🤖</text>
    <text x="54" y="32" font-family="'Arial Bold', sans-serif" font-size="15" fill="#ffffff" font-weight="700">AI Content Generator</text>
    <text x="54" y="48" font-family="'Courier New', monospace" font-size="10" fill="#8b949e">Next.js · OpenAI API · TypeScript · Vercel</text>
    <line x1="20" y1="58" x2="392" y2="58" stroke="rgba(157,78,221,0.1)" stroke-width="1"/>
    <text x="20" y="78" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">AI-powered app for generating blogs,</text>
    <text x="20" y="96" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">captions &amp; code with streaming output.</text>
    <rect x="20" y="110" width="64" height="18" rx="9" fill="rgba(157,78,221,0.08)" stroke="rgba(157,78,221,0.3)" stroke-width="0.8"/>
    <text x="52" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9d4edd">Next.js</text>
    <rect x="92" y="110" width="64" height="18" rx="9" fill="rgba(16,163,127,0.08)" stroke="rgba(16,163,127,0.3)" stroke-width="0.8"/>
    <text x="124" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#10a37f">OpenAI</text>
    <rect x="164" y="110" width="82" height="18" rx="9" fill="rgba(0,122,204,0.08)" stroke="rgba(0,122,204,0.3)" stroke-width="0.8"/>
    <text x="205" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#007ACC">TypeScript</text>
    <rect x="20" y="138" width="90" height="24" rx="12" fill="url(#g4)"/>
    <text x="65" y="154" text-anchor="middle" font-family="'Arial Bold', sans-serif" font-size="11" fill="#fff" font-weight="700">🌐 Live Demo</text>
    <rect x="120" y="138" width="76" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="158" y="154" text-anchor="middle" font-family="'Arial Bold', sans-serif" font-size="11" fill="#ccc">💻 Code</text>
  </g>

  <!-- Bottom accent -->
  <rect x="150" y="478" width="600" height="2" rx="1" fill="url(#hdr)" opacity="0.5"/>
</svg>
