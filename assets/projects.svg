    <rect x="100" y="110" width="52" height="18" rx="9" fill="rgba(97,218,251,0.08)" stroke="rgba(97,218,251,0.3)" stroke-width="0.8"/>
    <text x="126" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#61DAFB">React</text>
    <rect x="160" y="110" width="48" height="18" rx="9" fill="rgba(220,56,45,0.1)" stroke="rgba(220,56,45,0.3)" stroke-width="0.8"/>
    <text x="184" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#DC382D">Redis</text>
    <rect x="20" y="138" width="90" height="24" rx="12" fill="url(#g2)"/>
    <text x="65" y="154" text-anchor="middle" font-family="'Arial Bold', sans-serif" font-size="11" fill="#000" font-weight="700">🌐 Live Demo</text>
    <rect x="120" y="138" width="76" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="158" y="154" text-anchor="middle" font-family="'Arial Bold', sans-serif" font-size="11" fill="#ccc">💻 Code</text>
  </g>

