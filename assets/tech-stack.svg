<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020916"/>
      <stop offset="100%" style="stop-color:#0b1629"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="30%" style="stop-color:#00d9ff"/>
      <stop offset="70%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="url(#bg)" rx="16"/>
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.7" fill="#00d9ff" opacity="0.055"/>
  </pattern>
  <rect width="900" height="420" fill="url(#dots)" rx="16"/>
  <rect width="898" height="418" x="1" y="1" rx="15" fill="none" stroke="rgba(0,217,255,0.22)" stroke-width="1"/>
  <rect x="150" y="0" width="600" height="2" rx="1" fill="url(#hdr)"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" fill="#00d9ff" letter-spacing="5" font-weight="900" filter="url(#softglow)">CORE TECHNOLOGY STACK</text>
  <rect x="150" y="52" width="600" height="1" rx="0.5" fill="url(#hdr)" opacity="0.4"/>

  <!-- ═══ FRONTEND ═══ -->
  <text x="50" y="88" font-family="'Courier New', monospace" font-size="10" fill="#00d9ff" letter-spacing="3" opacity="0.7">🌐  FRONTEND</text>
  <line x1="140" y1="84" x2="870" y2="84" stroke="rgba(0,217,255,0.12)" stroke-width="1"/>

  <!-- Badge helper: each badge is 112x32 with 10px gap -->
  <!-- Row 1: React, Next.js, TypeScript, JavaScript, TailwindCSS, Redux -->
  <g transform="translate(50, 96)">
    <!-- React -->
    <g><rect width="118" height="30" rx="8" fill="rgba(97,218,251,0.07)" stroke="#61DAFB" stroke-width="1" opacity="0.8"/>
    <text x="59" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#61DAFB" font-weight="bold">⚛ React</text></g>
    <!-- Next.js -->
    <g transform="translate(128,0)"><rect width="118" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <text x="59" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" font-weight="bold">▲ Next.js</text></g>
    <!-- TypeScript -->
    <g transform="translate(256,0)"><rect width="128" height="30" rx="8" fill="rgba(49,120,198,0.08)" stroke="#3178C6" stroke-width="1" opacity="0.8"/>
    <text x="64" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#3178C6" font-weight="bold">TS TypeScript</text></g>
    <!-- JavaScript -->
    <g transform="translate(394,0)"><rect width="120" height="30" rx="8" fill="rgba(247,223,30,0.07)" stroke="#F7DF1E" stroke-width="1" opacity="0.8"/>
    <text x="60" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#F7DF1E" font-weight="bold">JS JavaScript</text></g>
    <!-- TailwindCSS -->
    <g transform="translate(524,0)"><rect width="130" height="30" rx="8" fill="rgba(6,182,212,0.07)" stroke="#06B6D4" stroke-width="1" opacity="0.8"/>
    <text x="65" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#06B6D4" font-weight="bold">~ TailwindCSS</text></g>
    <!-- Redux -->
    <g transform="translate(664,0)"><rect width="100" height="30" rx="8" fill="rgba(118,74,188,0.08)" stroke="#764ABC" stroke-width="1" opacity="0.8"/>
    <text x="50" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#764ABC" font-weight="bold">◈ Redux</text></g>
  </g>

  <!-- ═══ BACKEND ═══ -->
  <text x="50" y="170" font-family="'Courier New', monospace" font-size="10" fill="#ff6b9d" letter-spacing="3" opacity="0.7">⚙️  BACKEND &amp; DATABASE</text>
  <line x1="220" y1="166" x2="870" y2="166" stroke="rgba(255,107,157,0.12)" stroke-width="1"/>

  <g transform="translate(50, 178)">
    <!-- Node.js -->
    <g><rect width="110" height="30" rx="8" fill="rgba(51,153,51,0.08)" stroke="#339933" stroke-width="1" opacity="0.8"/>
    <text x="55" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#339933" font-weight="bold">⬡ Node.js</text></g>
    <!-- Express -->
    <g transform="translate(120,0)"><rect width="118" height="30" rx="8" fill="rgba(150,150,150,0.06)" stroke="#888" stroke-width="1" opacity="0.7"/>
    <text x="59" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#aaa" font-weight="bold">≡ Express.js</text></g>
    <!-- MongoDB -->
    <g transform="translate(248,0)"><rect width="116" height="30" rx="8" fill="rgba(71,162,72,0.08)" stroke="#47A248" stroke-width="1" opacity="0.8"/>
    <text x="58" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#47A248" font-weight="bold">🍃 MongoDB</text></g>
    <!-- PostgreSQL -->
    <g transform="translate(374,0)"><rect width="122" height="30" rx="8" fill="rgba(51,103,145,0.08)" stroke="#336791" stroke-width="1" opacity="0.8"/>
    <text x="61" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#336791" font-weight="bold">🐘 PostgreSQL</text></g>
    <!-- MySQL -->
    <g transform="translate(506,0)"><rect width="100" height="30" rx="8" fill="rgba(68,121,161,0.08)" stroke="#4479A1" stroke-width="1" opacity="0.8"/>
    <text x="50" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#4479A1" font-weight="bold">🗄 MySQL</text></g>
    <!-- Redis -->
    <g transform="translate(616,0)"><rect width="100" height="30" rx="8" fill="rgba(220,56,45,0.08)" stroke="#DC382D" stroke-width="1" opacity="0.8"/>
    <text x="50" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#DC382D" font-weight="bold">⚡ Redis</text></g>
    <!-- Firebase -->
    <g transform="translate(726,0)"><rect width="108" height="30" rx="8" fill="rgba(255,202,40,0.07)" stroke="#FFCA28" stroke-width="1" opacity="0.8"/>
    <text x="54" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#FFCA28" font-weight="bold">🔥 Firebase</text></g>
  </g>

  <!-- ═══ TOOLS ═══ -->
  <text x="50" y="252" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" letter-spacing="3" opacity="0.7">🛠️  TOOLS &amp; PLATFORMS</text>
  <line x1="205" y1="248" x2="870" y2="248" stroke="rgba(0,255,136,0.12)" stroke-width="1"/>

  <g transform="translate(50, 260)">
    <!-- Git -->
    <g><rect width="90" height="30" rx="8" fill="rgba(240,80,50,0.08)" stroke="#F05032" stroke-width="1" opacity="0.8"/>
    <text x="45" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#F05032" font-weight="bold">⑂ Git</text></g>
    <!-- GitHub -->
    <g transform="translate(100,0)"><rect width="108" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="#888" stroke-width="1" opacity="0.7"/>
    <text x="54" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ccc" font-weight="bold">◎ GitHub</text></g>
    <!-- Docker -->
    <g transform="translate(218,0)"><rect width="108" height="30" rx="8" fill="rgba(36,150,237,0.08)" stroke="#2496ED" stroke-width="1" opacity="0.8"/>
    <text x="54" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#2496ED" font-weight="bold">🐳 Docker</text></g>
    <!-- VS Code -->
    <g transform="translate(336,0)"><rect width="112" height="30" rx="8" fill="rgba(0,122,204,0.08)" stroke="#007ACC" stroke-width="1" opacity="0.8"/>
    <text x="56" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#007ACC" font-weight="bold">◧ VS Code</text></g>
    <!-- Figma -->
    <g transform="translate(458,0)"><rect width="104" height="30" rx="8" fill="rgba(242,78,30,0.07)" stroke="#F24E1E" stroke-width="1" opacity="0.8"/>
    <text x="52" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#F24E1E" font-weight="bold">✦ Figma</text></g>
    <!-- Vercel -->
    <g transform="translate(572,0)"><rect width="104" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <text x="52" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#fff" font-weight="bold">▲ Vercel</text></g>
    <!-- Postman -->
    <g transform="translate(686,0)"><rect width="112" height="30" rx="8" fill="rgba(255,108,55,0.08)" stroke="#FF6C37" stroke-width="1" opacity="0.8"/>
    <text x="56" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#FF6C37" font-weight="bold">⬡ Postman</text></g>
  </g>

  <!-- ═══ LEARNING ═══ -->
  <text x="50" y="334" font-family="'Courier New', monospace" font-size="10" fill="#9d4edd" letter-spacing="3" opacity="0.7">🌱  CURRENTLY LEARNING</text>
  <line x1="225" y1="330" x2="870" y2="330" stroke="rgba(157,78,221,0.12)" stroke-width="1"/>

  <g transform="translate(50, 342)">
    <g><rect width="138" height="30" rx="8" fill="rgba(157,78,221,0.07)" stroke="#9d4edd" stroke-width="1" opacity="0.8"/>
    <text x="69" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#9d4edd" font-weight="bold">🤖 AI Integration</text></g>
    <g transform="translate(148,0)"><rect width="138" height="30" rx="8" fill="rgba(157,78,221,0.07)" stroke="#9d4edd" stroke-width="1" opacity="0.8"/>
    <text x="69" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#9d4edd" font-weight="bold">⚙ System Design</text></g>
    <g transform="translate(296,0)"><rect width="158" height="30" rx="8" fill="rgba(157,78,221,0.07)" stroke="#9d4edd" stroke-width="1" opacity="0.8"/>
    <text x="79" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#9d4edd" font-weight="bold">☁ Cloud Architecture</text></g>
    <g transform="translate(464,0)"><rect width="168" height="30" rx="8" fill="rgba(157,78,221,0.07)" stroke="#9d4edd" stroke-width="1" opacity="0.8"/>
    <text x="84" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#9d4edd" font-weight="bold">📈 Performance Opt.</text></g>
  </g>

  <!-- Bottom accent -->
  <rect x="150" y="418" width="600" height="2" rx="1" fill="url(#hdr)" opacity="0.5"/>
</svg>
