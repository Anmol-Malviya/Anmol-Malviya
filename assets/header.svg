<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020916"/>
      <stop offset="50%" style="stop-color:#0b1629"/>
      <stop offset="100%" style="stop-color:#020916"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff"/>
      <stop offset="45%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#ff6b9d"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="30%" style="stop-color:#00d9ff"/>
      <stop offset="70%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="nameglow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="16"/>
  <!-- Subtle noise overlay -->
  <rect width="900" height="200" fill="rgba(255,255,255,0.012)" rx="16" filter="url(#noise)"/>

  <!-- Grid dots pattern (subtle) -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="0.8" fill="#00d9ff" opacity="0.08"/>
  </pattern>
  <rect width="900" height="200" fill="url(#dots)" rx="16"/>

  <!-- Outer border glow -->
  <rect width="898" height="198" x="1" y="1" rx="15" fill="none" stroke="url(#lineGrad)" stroke-width="1">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top accent line -->
  <rect x="200" y="0" width="500" height="2" rx="1" fill="url(#lineGrad)" opacity="0.9"/>

  <!-- Corner brackets — top-left -->
  <path d="M18,18 L52,18 M18,18 L18,52" stroke="#00d9ff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Corner brackets — top-right -->
  <path d="M882,18 L848,18 M882,18 L882,52" stroke="#00d9ff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Corner brackets — bottom-left -->
  <path d="M18,182 L52,182 M18,182 L18,148" stroke="#ff6b9d" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Corner brackets — bottom-right -->
  <path d="M882,182 L848,182 M882,182 L882,148" stroke="#ff6b9d" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Twinkling stars -->
  <circle cx="40" cy="30" r="1.2" fill="white"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="110" cy="55" r="0.8" fill="#00d9ff"><animate attributeName="opacity" values="1;0.1;1" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="25" r="1" fill="white"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="750" cy="35" r="1.2" fill="white"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="60" r="0.8" fill="#ff6b9d"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="870" cy="22" r="1" fill="white"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="165" r="1" fill="#00d9ff"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="840" cy="170" r="0.9" fill="white"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="170" r="0.7" fill="#ff6b9d"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="168" r="0.9" fill="#00d9ff"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>

  <!-- Floating orbs -->
  <circle cx="120" cy="100" r="60" fill="#00d9ff" opacity="0.025"/>
  <circle cx="780" cy="100" r="60" fill="#ff6b9d" opacity="0.025"/>

  <!-- Role tag pill -->
  <rect x="350" y="40" width="200" height="22" rx="11" fill="rgba(0,217,255,0.08)" stroke="#00d9ff" stroke-width="0.8" opacity="0.7"/>
  <text x="450" y="55" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#00d9ff" letter-spacing="2" opacity="0.9">FULL STACK DEVELOPER</text>

  <!-- Main name -->
  <text x="450" y="115" text-anchor="middle" font-family="Arial Black, 'Arial Bold', sans-serif" font-size="58" font-weight="900" fill="url(#nameGrad)" filter="url(#nameglow)" letter-spacing="6">
    ANMOL MALVIYA
    <animate attributeName="opacity" values="0.88;1;0.88" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="142" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" fill="#8b949e" letter-spacing="4">
    React · Node.js · MongoDB · Next.js · TypeScript
  </text>

  <!-- Animated underline -->
  <rect height="2" rx="1" fill="url(#lineGrad)" y="152">
    <animate attributeName="x" values="450;200;450" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="width" values="0;500;0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </rect>

  <!-- India flag emoji text -->
  <text x="450" y="175" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#444" letter-spacing="3">INDIA  ·  OPEN TO REMOTE  ·  BUILDING THE FUTURE</text>

  <!-- Bottom accent -->
  <rect x="200" y="198" width="500" height="2" rx="1" fill="url(#lineGrad)" opacity="0.7"/>
</svg>
